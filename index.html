<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bill Splitter - Custom Itemized Split</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --danger: #ef4444;
            --input-bg: #0f172a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .title {
            font-size: 1.25rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .subtitle {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 20px;
            line-height: 1.4;
        }

        /* Items Container */
        #items-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 24px;
        }

        .item-card {
            background-color: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
        }

        .item-row {
            display: flex;
            gap: 12px;
        }

        .item-name-input {
            flex: 1;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 10px 12px;
            color: var(--text-main);
            font-size: 0.95rem;
        }

        .item-price-wrapper {
            position: relative;
            width: 140px;
        }

        .currency-symbol {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-weight: 500;
        }

        .item-price-input {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 10px 12px 10px 28px;
            color: var(--text-main);
            font-size: 0.95rem;
            text-align: right;
        }

        .item-assignment-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .assignment-label {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        /* Multi-select dropdown styling */
        .multi-select-container {
            position: relative;
            flex: 1;
        }

        .multi-select-btn {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 8px 12px;
            color: var(--text-main);
            font-size: 0.9rem;
            text-align: left;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .multi-select-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            margin-top: 4px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.4);
            display: none;
            z-index: 10;
            max-height: 150px;
            overflow-y: auto;
        }

        .multi-select-dropdown.show {
            display: block;
        }

        .dropdown-option {
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .dropdown-option:hover {
            background: rgba(99, 102, 241, 0.1);
        }

        .delete-btn {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            padding: 6px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .delete-btn:hover {
            background: rgba(239, 68, 68, 0.1);
        }

        /* Participant Totals Section */
        .totals-section {
            border-top: 1px solid var(--card-border);
            padding-top: 16px;
            margin-bottom: 24px;
        }

        .totals-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .participant-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .participant-row {
            background-color: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
        }

        .participant-name {
            font-weight: 500;
        }

        .participant-amount {
            font-weight: 600;
            color: var(--text-main);
        }

        .record-btn {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background-color 0.2s;
        }

        .record-btn:hover {
            background-color: var(--primary-hover);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="title">
                <span>📋</span> Custom Itemized Split
            </div>
            <button class="btn-primary" id="add-item-btn">
                <span>+</span> Add Item
            </button>
        </div>
        <div class="subtitle">
            Add individual items and assign them to specific people or split them evenly among multiple members.
        </div>

        <!-- Dynamic Items Container -->
        <div id="items-container">
            <!-- Items injected via JS -->
        </div>

        <!-- Participant Totals -->
        <div class="totals-section">
            <div class="totals-header">
                <span>Participant Totals</span>
                <span id="grand-total">Total: €0.00</span>
            </div>
            <div class="participant-list" id="participant-list">
                <!-- Participant rows injected via JS -->
            </div>
        </div>

        <button class="record-btn" id="record-btn">
            <span>💾</span> Record Itemized Bill
        </button>
    </div>

    <script>
        // State management
        const participants = ["Luke", "Jon", "Sam"];
        const currencySymbol = "€";
        
        let items = [
            { id: 1, name: "", price: 0, assignedTo: ["all"] } // Default initial empty item
        ];

        function renderApp() {
            renderItems();
            renderTotals();
        }

        function renderItems() {
            const container = document.getElementById("items-container");
            container.innerHTML = "";

            items.forEach((item, index) => {
                const card = document.createElement("div");
                card.className = "item-card";

                // Generate options text for multi-select button
                let displayText = "Split Evenly (All)";
                if (!item.assignedTo.includes("all") && item.assignedTo.length > 0) {
                    displayText = item.assignedTo.join(", ");
                } else if (item.assignedTo.length === 0) {
                    displayText = "Select people...";
                }

                card.innerHTML = `
                    <div class="item-row">
                        <input type="text" class="item-name-input" placeholder="Item Name" value="${item.name}" data-id="${item.id}" oninput="updateItemName(${item.id}, this.value)">
                        <div class="item-price-wrapper">
                            <span class="currency-symbol">${currencySymbol}</span>
                            <input type="number" step="0.01" class="item-price-input" placeholder="0.00" value="${item.price || ''}" data-id="${item.id}" oninput="updateItemPrice(${item.id}, this.value)">
                        </div>
                    </div>
                    <div class="item-assignment-row">
                        <span class="assignment-label">Assigned To:</span>
                        <div class="multi-select-container">
                            <button type="button" class="multi-select-btn" onclick="toggleDropdown(${item.id})">
                                <span>${displayText}</span>
                                <span>▼</span>
                            </button>
                            <div class="multi-select-dropdown" id="dropdown-${item.id}">
                                <div class="dropdown-option" onclick="toggleAssignment(${item.id}, 'all')">
                                    <input type="checkbox" ${item.assignedTo.includes('all') ? 'checked' : ''} pointer-events="none"> Split Evenly (Everyone)
                                </div>
                                ${participants.map(p => `
                                    <div class="dropdown-option" onclick="toggleAssignment(${item.id}, '${p}')">
                                        <input type="checkbox" ${item.assignedTo.includes(p) ? 'checked' : ''} pointer-events="none"> ${p}
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                        ${items.length > 1 ? `<button class="delete-btn" onclick="deleteItem(${item.id})">🗑️</button>` : ''}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderTotals() {
            // Calculate individual totals dynamically based on assignments
            const totals = {};
            participants.forEach(p => totals[p] = 0);
            let grandTotal = 0;

            items.forEach(item => {
                const price = parseFloat(item.price) || 0;
                grandTotal += price;

                if (item.assignedTo.length === 0) return;

                if (item.assignedTo.includes("all")) {
                    const splitAmount = price / participants.length;
                    participants.forEach(p => {
                        totals[p] += splitAmount;
                    });
                } else {
                    const splitAmount = price / item.assignedTo.length;
                    item.assignedTo.forEach(p => {
                        if (totals[p] !== undefined) {
                            totals[p] += splitAmount;
                        }
                    });
                }
            });

            // Render participant list amounts
            const listContainer = document.getElementById("participant-list");
            listContainer.innerHTML = participants.map(p => `
                <div class="participant-row">
                    <span class="participant-name">${p}</span>
                    <span class="participant-amount">${currencySymbol}${totals[p].toFixed(2)}</span>
                </div>
            `).join('');

            // Render grand total
            document.getElementById("grand-total").innerText = `Total: ${currencySymbol}${grandTotal.toFixed(2)}`;
        }

        function addItem() {
            items.push({
                id: Date.now(),
                name: "",
                price: 0,
                assignedTo: ["all"]
            });
            renderApp();
        }

        function deleteItem(id) {
            items = items.filter(i => i.id !== id);
            renderApp();
        }

        function updateItemName(id, value) {
            const item = items.find(i => i.id === id);
            if (item) item.name = value;
        }

        function updateItemPrice(id, value) {
            const item = items.find(i => i.id === id);
            if (item) {
                item.price = value;
                renderTotals(); // Update totals instantly on price keystroke
            }
        }

        function toggleDropdown(id) {
            // Close all other dropdowns first
            document.querySelectorAll('.multi-select-dropdown').forEach(el => {
                if (el.id !== `dropdown-${id}`) el.classList.remove('show');
            });
            const dropdown = document.getElementById(`dropdown-${id}`);
            dropdown.classList.toggle('show');
        }

        function toggleAssignment(id, target) {
            const item = items.find(i => i.id === id);
            if (!item) return;

            if (target === 'all') {
                if (item.assignedTo.includes('all')) {
                    item.assignedTo = [];
                } else {
                    item.assignedTo = ['all'];
                }
            } else {
                // Remove 'all' if specific person chosen
                if (item.assignedTo.includes('all')) {
                    item.assignedTo = [];
                }

                const index = item.assignedTo.indexOf(target);
                if (index > -1) {
                    item.assignedTo.splice(index, 1);
                } else {
                    item.assignedTo.push(target);
                }

                // If empty or all selected manually, adjust accordingly
                if (item.assignedTo.length === participants.length) {
                    item.assignedTo = ['all'];
                }
            }

            renderApp();
            // Keep current dropdown open after click
            const dropdown = document.getElementById(`dropdown-${id}`);
            if (dropdown) dropdown.classList.add('show');
        }

        // Close dropdowns when clicking outside
        window.addEventListener('click', function(e) {
            if (!e.target.closest('.multi-select-container')) {
                document.querySelectorAll('.multi-select-dropdown').forEach(el => {
                    el.classList.remove('show');
                });
            }
        });

        // Event listener for add button
        document.getElementById('add-item-btn').addEventListener('click', addItem);
        document.getElementById('record-btn').addEventListener('click', () => {
            alert("Itemized bill successfully recorded!");
        });

        // Initial render
        renderApp();
    </script>
</body>
</html>
